<!-- // src/app/components/signup/signup.component.html -->
<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-purple-50 to-pink-100 p-4">
  <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border border-gray-200">
    <h2 class="text-3xl font-extrabold text-center text-gray-800 mb-8">Create Your Account</h2>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <div>
      <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input
        type="email"
        id="username"
        formControlName="username"
        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500 sm:text-sm transition duration-150 ease-in-out"
        placeholder="Enter your email"
      >
      <div *ngIf="signupForm.get('username')?.invalid && signupForm.get('username')?.touched" class="text-red-600 text-xs mt-1">
        <span *ngIf="signupForm.get('username')?.errors?.['required']">Email is required.</span>
        <span *ngIf="signupForm.get('username')?.errors?.['email']">Please enter a valid email address.</span>
      </div>
    </div>
      

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500 sm:text-sm transition duration-150 ease-in-out"
          placeholder="Create a password"
        >
        <div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched" class="text-red-600 text-xs mt-1">
          Password is required and must be at least 6 characters.
        </div>
      </div>

      <div>
        <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Role</label>
        <select
          id="role"
          formControlName="role"
          class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500 sm:text-sm transition duration-150 ease-in-out"
        >
          <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
        </select>
      </div>

      <div *ngIf="errorMessage" class="p-3 bg-red-100 border border-red-400 text-red-700 rounded-md" role="alert">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="p-3 bg-green-100 border border-green-400 text-green-700 rounded-md" role="alert">
        {{ successMessage }}
      </div>

      <button
        type="submit"
        [disabled]="signupForm.invalid"
        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-semibold text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition duration-200 ease-in-out transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Sign Up
      </button>
    </form>

    <div class="mt-8 text-center">
      <p class="text-sm text-gray-600">
        Already have an account?
        <a routerLink="/login" class="font-medium text-purple-600 hover:text-purple-500 transition duration-150 ease-in-out">
          Log In here
        </a>
      </p>
    </div>
  </div>
</div>
