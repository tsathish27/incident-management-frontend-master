<div class="flex items-center justify-center py-8">
  <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-lg border border-gray-200">
    <h2 class="text-3xl font-extrabold text-center text-gray-800 mb-8">Raise a New Ticket</h2>

    <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Ticket Title</label>
        <input
          type="text"
          id="title"
          formControlName="title"
          class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-150 ease-in-out"
          placeholder="Enter a concise title for your issue"
        >
        <div *ngIf="ticketForm.get('title')?.invalid && ticketForm.get('title')?.touched" class="text-red-600 text-xs mt-1">
          Ticket title is required.
        </div>
      </div>

      <div>
        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea
          id="description"
          formControlName="description"
          rows="5"
          class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-150 ease-in-out resize-y"
          placeholder="Provide a detailed description of your issue"
        ></textarea>
        <div *ngIf="ticketForm.get('description')?.invalid && ticketForm.get('description')?.touched" class="text-red-600 text-xs mt-1">
          Description is required.
        </div>
      </div>

      <div>
        <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
        <select
          id="category"
          formControlName="category"
          class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-150 ease-in-out"
        >
          <option value="" disabled>Select a category</option>
          <option value="software">Software</option>
          <option value="hardware">Hardware</option>
          <option value="network">Network</option>
        </select>
        <div *ngIf="ticketForm.get('category')?.invalid && ticketForm.get('category')?.touched" class="text-red-600 text-xs mt-1">
          Category is required.
        </div>
      </div>

      <div *ngIf="errorMessage" class="p-3 bg-red-100 border border-red-400 text-red-700 rounded-md" role="alert">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="p-3 bg-green-100 border border-green-400 text-green-700 rounded-md" role="alert">
        {{ successMessage }}
      </div>

      <button
        type="submit"
        [disabled]="ticketForm.invalid"
        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-200 ease-in-out transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Raise Ticket
      </button>
    </form>
  </div>
</div>
