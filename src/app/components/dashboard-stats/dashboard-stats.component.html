<div class="container mx-auto px-4 py-8">
  <h2 class="text-3xl font-extrabold text-gray-800 mb-8 text-center">Admin Dashboard Statistics</h2>

  <div *ngIf="loading" class="text-center text-gray-600">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-gray-600 mx-auto mb-4"></div>
    Loading dashboard stats...
  </div>

  <div *ngIf="errorMessage" class="p-4 bg-red-100 border border-red-400 text-red-700 rounded-md mb-4" role="alert">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white rounded-lg shadow-lg p-6 text-center border border-blue-200 transform hover:scale-105 transition-transform duration-200">
      <h3 class="text-xl font-semibold text-blue-700 mb-4">Open Incidents</h3>
      <p class="text-5xl font-bold text-blue-600">{{ stats.open }}</p>
    </div>

    <div class="bg-white rounded-lg shadow-lg p-6 text-center border border-green-200 transform hover:scale-105 transition-transform duration-200">
      <h3 class="text-xl font-semibold text-green-700 mb-4">Resolved Incidents</h3>
      <p class="text-5xl font-bold text-green-600">{{ stats.resolved }}</p>
    </div>

    <div class="bg-white rounded-lg shadow-lg p-6 text-center border border-red-200 transform hover:scale-105 transition-transform duration-200">
      <h3 class="text-xl font-semibold text-red-700 mb-4">SLA Breaches</h3>
      <p class="text-5xl font-bold text-red-600">{{ stats.breaches }}</p>
    </div>
  </div>
</div>
